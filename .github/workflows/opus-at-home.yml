name: opus-at-home

on:
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/opus-at-home.yml"
  push:
    branches: [main]
    paths:
      - "mac/**"
      - ".github/workflows/opus-at-home.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: mac/OPUSAtHome
        run: swift test
      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed 's/"//g')
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          echo "OPUS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            echo "OPUS_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: Build app
        env:
          OPUS_AT_HOME_BUILD: ${{ github.run_number }}
          OPUS_NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          OPUS_NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: mac/build.sh
      - name: Smoke test
        run: '"mac/dist/OPUS@Home.app/Contents/MacOS/OPUSAtHome" --help'
      - name: Screenshot the menu and settings
        run: |
          mkdir -p mac/dist/screens
          OPUS_AT_HOME_PREVIEW=1 "mac/dist/OPUS@Home.app/Contents/MacOS/OPUSAtHome" &
          sleep 15
          screencapture -x mac/dist/screens/preview.png || true
          kill %1 || true
          sleep 2
          "mac/dist/OPUS@Home.app/Contents/MacOS/OPUSAtHome" &
          sleep 10
          osascript -e 'tell application "System Events" to tell process "OPUSAtHome" to click menu bar item 1 of menu bar 2' || true
          sleep 3
          screencapture -x mac/dist/screens/menubar-click.png || true
          kill %1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: OPUS-at-Home
          path: mac/dist/OPUS-at-Home.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: mac/dist/screens
      - name: Publish latest build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete opus-at-home-latest --yes --cleanup-tag || true
          gh release create opus-at-home-latest mac/dist/OPUS-at-Home.zip --title "OPUS@Home (latest build)" --notes "Menu bar app that contributes to The OPUS Project with your Codex or Claude Code subscription. See mac/README.md." --target "$GITHUB_SHA"

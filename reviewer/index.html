<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Human review — The OPUS Project</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="review-header">
    <div class="title-row"><a href="../proofread.html">← OPUS proofreading</a><h1 id="workTitle">Human review with ScoreBrush</h1><a href="README.md">About this integration</a></div>
    <p id="status" role="status">Loading scores…</p>
    <div id="sourceRecovery" hidden>
      <p id="sourceError"></p>
      <label>Select the original source PDF <input id="sourceFile" type="file" accept="application/pdf,.pdf"></label>
      <a id="sourceLink" target="_blank" rel="noopener noreferrer">Download the recorded source</a>
    </div>
    <form id="reportForm" hidden>
      <label>Pages and passages checked <input id="coverage" required maxlength="2000" placeholder="e.g. pages 1–3, all systems"></label>
      <label>Result <select id="outcome"><option value="partial">Partial review</option><option value="corrections-needed">Corrections needed</option><option value="no-errors-found">No errors found in the stated coverage</option></select></label>
      <button type="submit">Download OPUS report</button><button id="backup" type="button">Save review backup</button>
      <a id="discussion" target="_blank" rel="noopener noreferrer" hidden>Post report to OPUS</a>
      <span class="help">Drafts save in this browser. A maintainer records verification after a complete review.</span>
    </form>
    <ul id="queue" hidden></ul>
  </header>
  <iframe id="workspace" title="ScoreBrush human proofreading workspace" hidden></iframe>
</body>
</html>
